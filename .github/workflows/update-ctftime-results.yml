name: Update CTFtime results

on:
  workflow_dispatch:
  schedule:
    - cron: "25 0 * * *"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install beautifulsoup4

      - name: Fetch CTFtime team results
        run: python scripts/update_ctftime_results.py

      - name: Commit updated results
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Update CTFtime results"
          file_pattern: data/ctftime-results.json
